# cargo-about configuration for generating third-party license attribution.
#
# The accepted license list must stay in sync with deny.toml's [licenses.allow].
# CI enforces this via script/check_license_config_sync.

accepted = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unlicense",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]

# Exclude private workspace crates (publish = false).
private = { ignore = true }

# Build and dev dependencies are not redistributed.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Built-in workarounds for crates with complicated license packaging.
workarounds = [
    "ring",
    "rustls",
]

# Warp's crates vendored under third_party/ (see third_party/README.md) keep
# their upstream `publish = false`, so `private.ignore` above skips them during
# generation, as it did when they were git dependencies:
#   - command-corrections (MIT)
#   - warp-command-signatures (MIT)
#   - warp-completion-metadata (MIT)
#   - warp-workflows (Apache-2.0)
#   - warp-workflows-types (Apache-2.0)
# Their LICENSE files are appended instead through ADDITIONAL_LICENSES in
# script/prepare_bundled_resources (and its Windows twin). mermaid_to_svg (MIT)
# and its dagre_rust (Apache-2.0) are publishable, so cargo-about includes them.
