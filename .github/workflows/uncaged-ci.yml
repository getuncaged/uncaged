# Uncaged CI — build & lint the GUI binary on push / PR to master|main|uncaged-0.3.
# No secrets required. macOS is the gating job; Linux/Windows are best-effort.
#
# This is Uncaged's OWN workflow (getuncaged/uncaged), independent of the
# upstream Warp ci.yml (which targets Warp's private, self-hosted infra).

name: Uncaged CI

on:
  push:
    # uncaged-0.3 is where Uncaged's work lands and releases are cut from.
    branches: [master, main, uncaged-0.3]
  pull_request:
    branches: [master, main, uncaged-0.3]

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: uncaged-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # No RUSTFLAGS here: setting it would replace the rustflags in
  # .cargo/config.toml. The dev profile already uses line-tables-only debug info.

jobs:
  # --- Primary gating jobs: macOS -----------------------------------------
  # The Uncaged GUI (uncaged) needs Apple's Metal toolchain (shipped with
  # Xcode) to compile its shaders, so macOS is the reference platform.
  #
  # The two clippy passes run as parallel jobs, each with its own cargo cache.
  # Clippy compiles the whole tree, so there is no separate `cargo build` step:
  # nothing downstream used its output.
  #
  # The advisory unit tests live in their own non-blocking job so a slow or
  # flaky test never holds up (or, by hitting the job ceiling, cancels) a lint.
  macos-clippy-default:
    name: Lint (macOS, default features)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The repo tracks some assets (input-classifier models, *.pdb) via
          # Git LFS — fetch them so the build has its resources.
          lfs: true

      # rust-toolchain.toml pins the exact channel (1.92.0 + rustfmt/clippy);
      # actions/checkout + the default toolchain honor it automatically, but we
      # install explicitly so fmt/clippy components are guaranteed present.
      - name: Install pinned Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rustfmt clippy

      - name: Cache cargo & target
        uses: Swatinem/rust-cache@v2
        with:
          key: macos-clippy-default

      # Cheap check first so obvious problems fail fast before the long lint.
      - name: cargo fmt --check
        run: cargo fmt --all --check

      # The tree is clippy-clean, so lints gate the job. Two feature sets, as
      # two parallel jobs, because each compiles code the other doesn't
      # (cloud_environments tests, release_bundle). dead_code is allowed:
      # features removed in the account-free fork leave plenty behind.
      - name: cargo clippy (default features)
        run: >-
          cargo clippy -p uncaged -p uncaged_engine
          --all-targets --tests -- -D warnings
          -A dead_code -A clippy::doc_lazy_continuation -A clippy::useless_conversion

  macos-clippy-all-features:
    name: Lint (macOS, all features)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      # The all-features clippy run enables the `nld_classifier_*` features,
      # whose `candle-onnx` build script runs prost-build and so needs protoc;
      # the macOS runner doesn't ship it.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pinned Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rustfmt clippy

      - name: Cache cargo & target
        uses: Swatinem/rust-cache@v2
        with:
          key: macos-clippy-all-features

      - name: cargo clippy (all features)
        run: >-
          cargo clippy -p uncaged -p uncaged_engine
          --all-targets --all-features --tests -- -D warnings
          -A dead_code -A clippy::doc_lazy_continuation -A clippy::useless_conversion

  # Advisory: never fails the check (continue-on-error). nextest runs each test
  # in its own process, in parallel; installed from a prebuilt binary.
  macos-tests:
    name: Unit tests (macOS, advisory)
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install pinned Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo & target
        uses: Swatinem/rust-cache@v2
        with:
          key: macos-tests

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: cargo nextest (uncaged lib)
        env:
          DISABLE_AUTO_UPDATE: "true"
        run: cargo nextest run -p uncaged --lib --no-fail-fast

  # --- Best-effort cross-platform builds ----------------------------------
  # Cross-platform GUI builds may need extra system libraries and are NOT yet
  # a supported release target, so they never block CI (continue-on-error).

  linux:
    name: Build (Linux, best-effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      # System build deps mirrored from script/linux/install_build_deps.
      # (freetype, fontconfig, expat, libgit2, ssl, clang, cmake, etc.)
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config python-is-python3 \
            libssl-dev libfreetype-dev libexpat1-dev libgit2-dev \
            libfontconfig1-dev jq brotli libclang-dev \
            libx11-dev libxcb1-dev libxi-dev libxcursor-dev \
            libxkbcommon-x11-dev libwayland-dev libegl1-mesa-dev

      - name: Install pinned Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rustfmt clippy

      - name: Cache cargo & target
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-uncaged

      # Catches code only this platform compiles, which the macOS lint never
      # sees. Clippy compiles everything, so no separate build step.
      - name: cargo clippy (uncaged)
        run: >-
          cargo clippy -p uncaged --lib --tests --bin uncaged -- -D warnings
          -A dead_code -A clippy::doc_lazy_continuation -A clippy::useless_conversion

  windows:
    name: Build (Windows, best-effort)
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      # Extra native deps (e.g. LLVM/clang for bindgen) may be required and
      # are left as a follow-up.
      - name: Install pinned Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rustfmt clippy

      - name: Cache cargo & target
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-uncaged

      # Catches code only this platform compiles, which the macOS lint never
      # sees. Clippy compiles everything, so no separate build step.
      - name: cargo clippy (uncaged)
        run: >-
          cargo clippy -p uncaged --lib --tests --bin uncaged -- -D warnings
          -A dead_code -A clippy::doc_lazy_continuation -A clippy::useless_conversion
