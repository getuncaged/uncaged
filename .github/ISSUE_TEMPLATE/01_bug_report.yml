name: Bug Report
description: "Found a bug? Search the open issues first to make sure it isn't already reported."
labels: ["bug"]
body:
  - type: checkboxes
    attributes:
      label: "Pre-submit Checks"
      options:
        - label: "I have [searched Uncaged issues](https://github.com/getuncaged/uncaged/issues?q=is%3Aissue+label%3Abug) and there are no duplicates"
          required: true
  - type: textarea
    id: "describe-the-bug"
    attributes:
      label: "Describe the bug"
      description: "A clear and concise description of what the bug is."
      placeholder: Tell us what you see.
    validations:
      required: true
  - type: textarea
    id: "to-reproduce"
    attributes:
      label: "To reproduce"
      description: "Bug reports with clear reproduction steps get fixed sooner."
      placeholder: "Steps to reproduce: 1. Go to '...' 2. Click on '...' 3. Scroll down to '...' 4. See error '...'"
    validations:
      required: true
  - type: textarea
    id: "expected-behavior"
    attributes:
      label: "Expected behavior"
      description: "A clear and concise description of what you expected to happen."
      placeholder: Tell us what you expect to see.
    validations:
      required: false
  - type: textarea
    id: "screenshots-logs"
    attributes:
      label: "Screenshots, videos, and logs"
      description: "If applicable, add screenshots, videos or logs. On macOS the log is `~/Library/Logs/uncaged.log`."
    validations:
      required: false
  - type: dropdown
    id: "os"
    attributes:
      label: "Operating system (OS)"
      multiple: false
      options:
        - "Select an OS"
        - macOS
        - Linux
        - Windows
    validations:
      required: true
  - type: input
    id: "os-version"
    attributes:
      label: "Operating system and version"
      description: "For example: macOS 26.1, Debian 12"
    validations:
      required: true
  - type: input
    id: "local-shell-version"
    attributes:
      label: "Shell version"
      description: "For example `zsh 5.9`. Run `bash --version` or `zsh --version`."
    validations:
      required: false
  - type: input
    id: "uncaged-version"
    attributes:
      label: "Uncaged version"
      description: "Shown in Settings > About."
    validations:
      required: false
  - type: dropdown
    id: "regression"
    attributes:
      label: "Regression"
      description: "Did this work in an earlier Uncaged version?"
      multiple: false
      options:
        - "No, it has always behaved this way"
        - "Yes, it started with a recent version"
    validations:
      required: true
  - type: textarea
    id: "additional-context"
    attributes:
      label: "Additional context"
      description: "Anything else that helps. On Linux, say whether you use X11 or Wayland."
    validations:
      required: false
