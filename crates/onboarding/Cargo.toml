[package]
name = "onboarding"
version = "0.1.0"
edition = "2021"
authors.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "onboarding"
path = "src/bin/main.rs"
required-features = ["bin"]

[features]
bin = []

[dependencies]
ai.workspace = true
anyhow.workspace = true
log.workspace = true
pathfinder_color.workspace = true
pathfinder_geometry.workspace = true
rust-embed.workspace = true
ui_components.workspace = true
uncaged_core = { workspace = true }
uncaged_ui.workspace = true
uncaged_ui_core.workspace = true
uncaged_logging.workspace = true

[dev-dependencies]
uncaged_core = { workspace = true, features = ["test-util"] }
