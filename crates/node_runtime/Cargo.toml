[package]
name = "node_runtime"
version = "0.1.0"
edition = "2021"
publish.workspace = true
license.workspace = true

[features]
local_fs = []

[dependencies]
anyhow = { workspace = true }
cfg-if = { workspace = true }
futures = { workspace = true }
log = { workspace = true }
http_client = { workspace = true }
semver = "1.0"
serde = { workspace = true }
uncaged_core = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
async-fs = { workspace = true }
command.workspace = true
flate2 = "1.0"
tar = "0.4"
# The Node.js, rust-analyzer and clangd zips we download and the log archives we
# write all use Deflate; Deflate64 (pure Rust, tiny) covers 7-Zip's variant of it.
# `time` keeps real modification times on written entries.
zip = { version = "2.1", default-features = false, features = ["deflate", "deflate64", "time"] }

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
anyhow.workspace = true
