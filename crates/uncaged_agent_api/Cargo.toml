# The agent protocol: the protobuf messages Agent Mode streams and persists.
#
# Vendored from Warp's `warp_multi_agent_api` (warp-proto-apis); see README.md.
# The Rust bindings are generated by `script/regen_agent_api` and checked in, so
# building this crate needs neither protoc nor a build script.
[package]
name = "uncaged_agent_api"
version = "0.0.0"
edition = "2021"
authors.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
prost.workspace = true
prost-types.workspace = true
