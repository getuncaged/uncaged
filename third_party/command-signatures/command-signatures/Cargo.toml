[package]
name = "warp-command-signatures"
version = "0.0.0"
edition = "2021"
authors = ["Warp Team <dev@warp.dev>"]
publish = false
license = "MIT"

[dependencies]
cfg-if = "1.0.0"
itertools = "0.10.0"
lazy_static = "1.4.0"
log = "0.4"
rayon = { version = "1.5.3", optional = true }
regex = "1.5.4"
flate2 = { version = "1.0", optional = true }
serde = {version = "1.0", features = ["derive"]}
serde_json = "1.0"
serde_with = "2.0.1"
warp-completion-metadata = {path = "../completion-metadata"}

[build-dependencies]
flate2 = "1.0"

[features]
default = ["embed-signatures"]
embed-signatures = ["rayon", "dep:flate2"]
