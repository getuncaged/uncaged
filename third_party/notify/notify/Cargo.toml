[package]
name = "notify"
version = "8.0.0"
description = "Cross-platform filesystem notification library"
documentation = "https://docs.rs/notify"
readme = "../README.md"
license = "CC0-1.0"
keywords = ["events", "filesystem", "notify", "watch"]
categories = ["filesystem"]
authors = [
  "Félix Saparelli <me@passcod.name>",
  "Daniel Faust <hessijames@gmail.com>",
  "Aron Heinecke <Ox0p54r36@t-online.de>"
]
rust-version = "1.77"
edition = "2021"
homepage = "https://github.com/notify-rs/notify"
repository = "https://github.com/notify-rs/notify.git"

[features]
default = ["macos_fsevent"]
serde = ["notify-types/serde"]
macos_kqueue = ["kqueue", "mio"]
macos_fsevent = ["fsevent-sys"]
serialization-compat-6 = ["notify-types/serialization-compat-6"]

[dependencies]
notify-types = "2.0.0"
crossbeam-channel = { version = "0.5.0", optional = true }
filetime = "0.2.22"
libc = "0.2.4"
log = "0.4.17"
walkdir = "2.4.0"

[target.'cfg(any(target_os="linux", target_os="android"))'.dependencies]
inotify = { version = "0.11.0", default-features = false }
mio = { version = "1.0", features = ["os-ext"] }

[target.'cfg(target_os="macos")'.dependencies]
bitflags = "2.7.0"
fsevent-sys = { version = "4.0.0", optional = true }
kqueue = { version = "1.0.8", optional = true }
mio = { version = "1.0", features = ["os-ext"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_WindowsProgramming", "Win32_System_IO"] }

[target.'cfg(any(target_os="freebsd", target_os="openbsd", target_os = "netbsd", target_os = "dragonflybsd", target_os = "ios"))'.dependencies]
kqueue = "1.0.8"
mio = { version = "1.0", features = ["os-ext"] }

# Local change (third_party/README.md): silence upstream warnings, as Cargo did
# with --cap-lints when this crate was a git dependency.
[lints.rust]
warnings = "allow"
